<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366f1" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="200" height="60" rx="12" fill="url(#bgGradient)" opacity="0">
    <animate attributeName="opacity" values="0;0.1;0" dur="3s" repeatCount="indefinite" begin="0s"/>
  </rect>
  <g filter="url(#glow)">
    <circle cx="30" cy="30" r="18" stroke="url(#logoGradient)" stroke-width="2" fill="none" opacity="0.8">
      <animate attributeName="r" values="18;20;18" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <path d="M30 18 L22 38 L26 38 L30 30 L34 38 L38 38 L30 18Z" fill="url(#logoGradient)">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <circle cx="30" cy="42" r="3" fill="#ec4899">
      <animate attributeName="r" values="3;4;3" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.7;1" dur="1s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="60" y="38" font-family="'Segoe UI', 'SF Pro Display', system-ui, sans-serif" font-size="28" font-weight="700" fill="url(#logoGradient)" filter="url(#shadow)">
    AllAble
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
  </text>
  <g opacity="0.6">
    <circle cx="15" cy="15" r="1.5" fill="white">
      <animate attributeName="opacity" values="0;1;0" dur="1.2s" repeatCount="indefinite" begin="0s"/>
      <animate attributeName="cy" values="15;12;15" dur="1.2s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle cx="45" cy="20" r="1" fill="white">
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="cy" values="20;17;20" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="55" cy="40" r="1.2" fill="white">
      <animate attributeName="opacity" values="0;1;0" dur="1.3s" repeatCount="indefinite" begin="0.8s"/>
      <animate attributeName="cy" values="40;37;40" dur="1.3s" repeatCount="indefinite" begin="0.8s"/>
    </circle>
  </g>
</svg>
